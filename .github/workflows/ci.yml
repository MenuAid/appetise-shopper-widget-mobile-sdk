name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew :sdk:testDebugUnitTest :sdk:assembleRelease

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      # Builds through the root manifest, as a partner's Xcode resolves it.
      - run: xcodebuild -scheme AppetiseShopper -destination 'generic/platform=iOS Simulator' build

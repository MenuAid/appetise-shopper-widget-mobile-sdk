name: Release

# Pushing a version tag such as 0.1.0 releases both SDKs. Swift Package Manager resolves the tag
# itself; this publishes the Android library to Maven Central under the same version.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write

jobs:
  maven-central:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Check the release secrets are set
        run: |
          for name in ORG_GRADLE_PROJECT_mavenCentralUsername ORG_GRADLE_PROJECT_mavenCentralPassword ORG_GRADLE_PROJECT_signingInMemoryKey; do
            if [ -z "${!name}" ]; then echo "::error::Missing release secret (${name}); see RELEASING.md"; exit 1; fi
          done
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew :sdk:testDebugUnitTest
      - run: ./gradlew :sdk:publishToMavenCentral -PVERSION_NAME=${{ github.ref_name }} --no-configuration-cache
      - name: GitHub release
        run: gh release create "${{ github.ref_name }}" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
